<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ketchup:#e63946;--ketchup-dark:#c1272d;--mustard:#ffb703;--cream:#fff6e5;--ink:#1d1a16;--teal:#2a9d8f;--paper:#fffdf6;--shadow:4px 4px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);--shadow-lg:6px 6px 0 var(--ink);--radius:16px;--border:3px solid var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:#ccc;min-height:100vh;display:flex;justify-content:center}
h1,h2,h3,.display{font-family:'Lilita One','Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:0.5px;margin:0;line-height:1.05}
.shell{width:360px;min-height:100vh;background:var(--cream);position:relative;overflow:hidden}
.config-overlay{position:absolute;inset:0;background:rgba(29,26,22,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.config-sheet{width:100%;max-width:480px;max-height:88vh;background:var(--cream);border:var(--border);border-bottom:none;border-radius:22px 22px 0 0;padding:0 18px 18px;display:flex;flex-direction:column;overflow:hidden}
.sheet-handle{width:56px;height:6px;border-radius:999px;background:var(--ink);margin:0 auto 14px}
.config-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:4px 0 10px;border-bottom:2px dashed rgba(29,26,22,0.15);margin-bottom:6px}
.sheet-title{font-size:24px;transform:rotate(-1deg);margin-bottom:0}
.config-starting-price{display:block;font-size:13px;font-weight:600;opacity:0.6;margin-top:2px}
.config-close-btn{border:var(--border);background:var(--paper);border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:800;flex:0 0 auto;display:grid;place-items:center;box-shadow:var(--shadow-sm);cursor:pointer}
.config-body{flex:1;overflow-y:auto;padding:4px 0 10px}
.config-group{margin-bottom:18px}
.config-group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.config-group-name{font-family:'Lilita One',sans-serif;font-size:16px;text-transform:uppercase}
.config-required-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;background:var(--mustard);border:2px solid var(--ink);border-radius:999px;padding:2px 8px;box-shadow:2px 2px 0 var(--ink)}
.config-hint{font-size:12px;font-weight:600;opacity:0.5}
.config-options{display:flex;flex-wrap:wrap;gap:8px}
.config-option-wrap{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.config-option{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.config-option.selected{background:var(--ketchup);color:#fff}
.config-price{font-size:12px;opacity:0.55}
.config-price-on{font-size:12px;opacity:0.85}
.config-addon-qty{display:flex;align-items:center;justify-content:center;gap:0;border:2px solid var(--ink);border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);overflow:hidden;width:fit-content}
.config-qty-btn{border:none;background:var(--mustard);font-size:16px;font-weight:700;width:32px;height:32px;cursor:pointer}
.config-qty-val{min-width:28px;text-align:center;font-weight:700;font-size:14px}
.config-error{color:var(--ketchup-dark);font-size:13px;font-weight:700;margin:8px 0}
.config-summary{font-size:12px;opacity:0.65;border-top:2px dashed rgba(29,26,22,0.15);padding-top:10px;margin-top:4px}
.config-footer{border-top:2px dashed rgba(29,26,22,0.15);padding:12px 0;display:flex;align-items:center;gap:12px}
.config-footer-price{display:flex;flex-direction:column;line-height:1.1}
.config-footer-label{font-size:11px;font-weight:700;text-transform:uppercase;opacity:0.5}
.config-footer .price{font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--border);border-radius:14px;background:var(--paper);color:var(--ink);font-weight:700;font-size:16px;padding:12px 18px;box-shadow:var(--shadow);text-transform:uppercase;letter-spacing:0.4px;cursor:pointer;font-family:inherit}
.btn-ketchup{background:var(--ketchup);color:#fff}
.btn-block{width:100%}
.muted{opacity:0.65;font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <div class="config-overlay">
    <div class="config-sheet">
      <div class="sheet-handle"></div>
      <div class="config-header">
        <div>
          <h3 class="sheet-title">Butter Chicken</h3>
          <span class="config-starting-price">Starting ₹280.00</span>
        </div>
        <button class="config-close-btn">✕</button>
      </div>
      <div class="config-body">
        <div class="config-group">
          <div class="config-group-header">
            <span class="config-group-name">Spice Level</span>
            <span class="config-required-badge">Required</span>
            <span class="config-hint">choose one</span>
          </div>
          <div class="config-options">
            <div class="config-option-wrap">
              <button class="config-option selected">Mild <span class="config-price-on">+₹0.00</span></button>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Medium <span class="config-price">+₹0.00</span></button>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Extra Hot 🔥 <span class="config-price">+₹20.00</span></button>
            </div>
          </div>
        </div>
        <div class="config-group">
          <div class="config-group-header">
            <span class="config-group-name">Bread</span>
            <span class="config-required-badge">Required</span>
          </div>
          <div class="config-options">
            <div class="config-option-wrap">
              <button class="config-option selected">Butter Naan <span class="config-price-on">+₹40.00</span></button>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Garlic Naan <span class="config-price">+₹50.00</span></button>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Roti <span class="config-price">+₹25.00</span></button>
            </div>
          </div>
        </div>
        <div class="config-group">
          <div class="config-group-header">
            <span class="config-group-name">Add-ons</span>
          </div>
          <div class="config-options">
            <div class="config-option-wrap">
              <button class="config-option selected">Extra Cheese <span class="config-price-on">+₹30.00</span></button>
              <div class="config-addon-qty">
                <button class="config-qty-btn">−</button>
                <span class="config-qty-val">2</span>
                <button class="config-qty-btn">+</button>
              </div>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Raita <span class="config-price">+₹25.00</span></button>
            </div>
            <div class="config-option-wrap">
              <button class="config-option">Papad <span class="config-price">+₹15.00</span></button>
            </div>
          </div>
        </div>
        <div class="config-summary">Mild • Butter Naan • Extra Cheese ×2</div>
      </div>
      <div class="config-footer">
        <div class="config-footer-price">
          <span class="config-footer-label">Total</span>
          <span class="price">₹400.00</span>
        </div>
        <button class="btn btn-ketchup btn-block">Add to tray ✓</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
