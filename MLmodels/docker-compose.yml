# ML services stack (audit item #13, updated for P0 auth on all three services).
# Shared secrets: set ML_SERVICE_TOKEN / ML_JWT_SECRET to the SAME values the
# ChitKuber backend uses (backend .env: ML_SERVICE_TOKEN, JWT_SECRET).
version: "3.9"

services:
  demand-model:
    build: ./Demand_forcasting_model
    environment:
      - NODE_ENV=production
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN}
      - ML_JWT_SECRET=${ML_JWT_SECRET:-pos-dev-secret-change-in-production}
      - ML_JWT_ISSUER=restaurant-pos
      - ML_ALLOW_HEADER_TENANT=${ML_ALLOW_HEADER_TENANT:-on}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ML_DEMAND_PERSIST=on
      - ML_DEMAND_DATA_DIR=/app/data/demand-state
    volumes:
      - demand-state:/app/data/demand-state
    ports:
      - "3000:3000"

  basket-model:
    build: ./Market_Basket_Analysis
    environment:
      - DATABASE_URL=${BASKET_DATABASE_URL:-sqlite:////app/data/restaurant_intelligence.db}
      - MODEL_STORE_PATH=/app/model_store
      - ARTIFACT_STORE_BACKEND=${ARTIFACT_STORE_BACKEND:-local}
      - ARTIFACT_STORE_S3_BUCKET=${ARTIFACT_STORE_S3_BUCKET:-}
      - ARTIFACT_STORE_S3_PREFIX=${ARTIFACT_STORE_S3_PREFIX:-}
      # Auth (P0 item #2 — mirrors the Demand service):
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN}
      - ML_JWT_SECRET=${ML_JWT_SECRET:-pos-dev-secret-change-in-production}
      - ML_JWT_ISSUER=restaurant-pos
      - ML_ALLOW_HEADER_TENANT=${ML_ALLOW_HEADER_TENANT:-on}
      - ML_ALLOWED_ORIGINS=${ML_ALLOWED_ORIGINS:-}
      # Startup auto-train tenant list (unset = external orchestration only).
      - AUTO_TRAIN_RESTAURANT_IDS=${AUTO_TRAIN_RESTAURANT_IDS:-}
    volumes:
      - basket-models:/app/model_store
      - basket-db:/app/data
    ports:
      - "8000:8000"

  uplit-model:
    build: ./Uplift
    environment:
      - DATABASE_URL=${UPLIT_DATABASE_URL:-sqlite:////app/data/restaurant_uplift.db}
      # Experiment events persist across restarts (volume-mounted JSON store).
      - UPLIT_EVENTS_PATH=/app/data/experiment_events.json
      # Offer-response model weights (spec Step 5) — same volume.
      - OFFER_RESPONSE_WEIGHTS_DIR=/app/data/offer-response-weights
      # Auth (P0 item #2):
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN}
      - ML_JWT_SECRET=${ML_JWT_SECRET:-pos-dev-secret-change-in-production}
      - ML_JWT_ISSUER=restaurant-pos
      - ML_ALLOW_HEADER_TENANT=${ML_ALLOW_HEADER_TENANT:-on}
      - ML_ALLOWED_ORIGINS=${ML_ALLOWED_ORIGINS:-}
    volumes:
      - uplit-data:/app/data
    ports:
      - "8001:8000"

  segmentation-model:
    build: ./Customer_segmentation_model
    environment:
      # Auth (P0 item #2 — same shared secrets as the other services):
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN}
      - ML_JWT_SECRET=${ML_JWT_SECRET:-pos-dev-secret-change-in-production}
      - ML_JWT_ISSUER=restaurant-pos
      - ML_ALLOW_HEADER_TENANT=${ML_ALLOW_HEADER_TENANT:-on}
      - ML_ALLOWED_ORIGINS=${ML_ALLOWED_ORIGINS:-}
      - SEGMENT_DATA_PATH=/app/data/customer_features.json
      - SEGMENT_MODEL_STORE_PATH=/app/model_store
    volumes:
      - segment-data:/app/data
      - segment-models:/app/model_store
    ports:
      - "8002:8000"

volumes:
  demand-state:
  basket-models:
  basket-db:
  uplit-data:
  segment-data:
  segment-models:
